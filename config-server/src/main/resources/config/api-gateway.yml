# Local development configuration for api-gateway
spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
        - id: task-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/tasks/**
        - id: notification-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/notification/**

# Eureka disabled for local development
eureka:
  client:
    enabled: false
