server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/taskscheduler
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

# Eureka config removed - will be provided by config server
# app.jwt.secret will be provided by config server

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    com.taskscheduler.auth: DEBUG
