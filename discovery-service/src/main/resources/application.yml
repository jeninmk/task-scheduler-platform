server:
  port: 8761

spring:
  application:
    name: discovery-service

eureka:
  instance:
    hostname: discovery-service  # Container hostname for Docker
    prefer-ip-address: false
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka
  server:
    wait-time-in-ms-when-sync-empty: 0
    enable-self-preservation: false  # Helpful for development

logging:
  level:
    com.netflix.eureka: DEBUG  # Changed to DEBUG for troubleshooting
    com.netflix.discovery: DEBUG
    org.springframework.cloud: DEBUG